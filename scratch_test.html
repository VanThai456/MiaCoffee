
<!DOCTYPE html>
<html>
<head>
<style>
.parent { width: 400px; height: 300px; position: relative; overflow: hidden; background: red; }
.img-left { position: absolute; top: 0; bottom: 0; height: 100%; width: 200%; left: 0; max-width: none; object-fit: cover; }
.img-right { position: absolute; top: 0; bottom: 0; height: 100%; width: 200%; left: -100%; max-width: none; object-fit: cover; }
</style>
</head>
<body>
<div class="parent"><img class="img-right" src="https://via.placeholder.com/1600x1200" /></div>
</body>
</html>
